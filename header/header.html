<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Header TheMagios</title>
<style>
  html, body { margin: 0; background: #2f8fe6; }
  body { display: grid; place-items: center; min-height: 100vh; }
  canvas { display: block; max-width: 100%; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="360"></canvas>
<script>
/*
 * Encabezado animado de TheMagios. Cielo caricaturesco, nubes con contorno negro,
 * título amarillo con trazo grueso y frases que se escriben solas.
 * Todo depende de t (segundos) con periodo T, para que render.js capture fotogramas
 * exactos y el GIF haga bucle sin saltos. El cuadro 0 ya muestra todo armado (portada).
 * Fuentes libres incrustadas desde build/fonts: Luckiest Guy (Apache 2.0) y Fredoka (OFL).
 */
const W = 1280, H = 360, T = 8;
const ctx = document.getElementById('c').getContext('2d');
const TAU = Math.PI * 2;

const C = {
  ink: '#1b1b1f', sky0: '#6cc9ff', sky1: '#2f8fe6', yellow: '#ffd90f', cream: '#fffbea',
  orange: '#ff9f1c', red: '#ef4135', green: '#3fbf5f', greenDark: '#2f9e4a', white: '#ffffff', shade: '#dff1ff',
};

const KICKER = 'EQUIPO DE DESARROLLO DE SOFTWARE';
const TITLE = 'TheMagios';
const PHRASES = ['Software a la medida, sin trucos de magia.', 'Si compila a la primera, sospechamos.'];
const CHIPS = ['Laravel', 'PHP', 'Java', 'Python', 'IA aplicada'];

const wave = (t, k = 1, ph = 0) => Math.sin(TAU * (t / T * k + ph)); // periódica en T
const clamp01 = x => Math.max(0, Math.min(1, x));

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// Nube: círculos negros más grandes debajo y blancos encima → contorno continuo.
const PUFFS = [[0, 0, 26], [30, -14, 32], [66, -6, 28], [92, 6, 20], [46, 10, 24], [14, 12, 20], [76, 14, 18]];
function cloud(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const k = 4 / s;
  ctx.fillStyle = C.ink;
  PUFFS.forEach(([cx, cy, r]) => { ctx.beginPath(); ctx.arc(cx, cy, r + k, 0, TAU); ctx.fill(); });
  ctx.fillStyle = C.white;
  PUFFS.forEach(([cx, cy, r]) => { ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill(); });
  ctx.fillStyle = C.shade;
  ctx.beginPath(); ctx.ellipse(50, 20, 44, 9, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function star(x, y, r, rot, fill) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i * Math.PI) / 4, rr = i % 2 ? r * 0.38 : r;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.lineJoin = 'round'; ctx.lineWidth = 3.5; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.fillStyle = fill; ctx.fill();
  ctx.restore();
}

function sky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.sky0); g.addColorStop(1, C.sky1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Rayos de sol girando detrás del título: avanzan exactamente un rayo por periodo.
  const N = 16, cx = 640, cy = 175;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate((TAU / N) * (t / T));
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  for (let i = 0; i < N; i += 2) {
    const a0 = (i / N) * TAU, a1 = ((i + 1) / N) * TAU;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 900, a0, a1); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function clouds(t) {
  [[60, 70, 0.9, 0], [1080, 60, 1.0, 0.3], [250, 290, 0.6, 0.6], [930, 285, 0.7, 0.15], [1180, 200, 0.5, 0.8], [20, 210, 0.55, 0.45]]
    .forEach(([x, y, s, ph]) => cloud(x + 26 * wave(t, 1, ph), y + 6 * wave(t, 2, ph), s));
}

function hills() {
  ctx.lineWidth = 6; ctx.strokeStyle = C.ink; ctx.lineJoin = 'round';
  const hill = (pts, fill) => {
    ctx.beginPath(); ctx.moveTo(-10, H + 10);
    pts.forEach(([x, y, cx, cy]) => ctx.quadraticCurveTo(cx, cy, x, y));
    ctx.lineTo(W + 10, H + 10); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); ctx.stroke();
  };
  hill([[-10, 335, -10, 335], [420, 345, 200, 300], [W + 10, 330, 900, 380]], C.greenDark);
  hill([[-10, 350, -10, 350], [700, 352, 330, 320], [W + 10, 342, 1050, 330]], C.green);
}

function pill(text, x, y, font, padX, h, fill, color) {
  ctx.font = font;
  const w = ctx.measureText(text).width + padX * 2;
  roundRect(x - w / 2 + 5, y + 5, w, h, h / 2); ctx.fillStyle = C.ink; ctx.fill();
  roundRect(x - w / 2, y, w, h, h / 2); ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y + h / 2 + 2);
  return w;
}

function title(t) {
  ctx.font = '132px LG';
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  const letters = [...TITLE];
  const widths = letters.map(ch => ctx.measureText(ch).width);
  const sp = 4, total = widths.reduce((a, b) => a + b, 0) + sp * (letters.length - 1);
  let x = 640 - total / 2;
  const base = 202;
  letters.forEach((ch, i) => {
    const dy = -9 * Math.max(0, wave(t, 2, -i * 0.07));
    const rot = 0.035 * wave(t, 2, -i * 0.07 + 0.25);
    ctx.save(); ctx.translate(x + widths[i] / 2, base + dy); ctx.rotate(rot);
    ctx.lineJoin = 'round'; ctx.miterLimit = 2;
    ctx.fillStyle = C.ink; ctx.strokeStyle = C.ink; ctx.lineWidth = 18;
    ctx.strokeText(ch, -widths[i] / 2 + 7, 8); ctx.fillText(ch, -widths[i] / 2 + 7, 8); // sombra dura
    ctx.strokeText(ch, -widths[i] / 2, 0);
    ctx.fillStyle = C.yellow; ctx.fillText(ch, -widths[i] / 2, 0);
    ctx.restore();
    x += widths[i] + sp;
  });
  // Destellos alrededor del título (titilan en bucle)
  [[290, 92, 16, 0], [995, 88, 20, 0.35], [1010, 205, 12, 0.6], [265, 200, 11, 0.8]].forEach(([sx, sy, r, ph]) => {
    const k = 0.75 + 0.25 * wave(t, 2, ph);
    star(sx, sy, r * k, (TAU / 8) * (t / T) * (ph > 0.5 ? -1 : 1), ph > 0.5 ? C.white : C.yellow);
  });
}

function phrase(t) {
  // 2 frases, 4 s cada una: llena (0–2.6), se borra (2.6–3.1), se escribe la siguiente (3.1–4).
  const slot = Math.floor(t / 4) % 2, local = t % 4;
  let txt, n;
  if (local < 2.6) { txt = PHRASES[slot]; n = txt.length; }
  else if (local < 3.1) { txt = PHRASES[slot]; n = Math.round(txt.length * (1 - (local - 2.6) / 0.5)); }
  else { txt = PHRASES[(slot + 1) % 2]; n = Math.round(txt.length * clamp01((local - 3.1) / 0.8)); }
  const shown = txt.slice(0, n);

  ctx.font = '700 27px FR';
  const bw = 640, bh = 50, bx = 640 - bw / 2, by = 232;
  roundRect(bx + 6, by + 6, bw, bh, 25); ctx.fillStyle = C.ink; ctx.fill();
  roundRect(bx, by, bw, bh, 25); ctx.fillStyle = C.cream; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = C.ink; ctx.stroke();
  ctx.fillStyle = C.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const full = ctx.measureText(txt).width, w = ctx.measureText(shown).width;
  const tx = 640 - full / 2;
  ctx.fillText(shown, tx, by + bh / 2 + 2);
  if (Math.floor(t * 2.5) % 2 === 0) { ctx.fillStyle = C.red; ctx.fillRect(tx + w + 4, by + 12, 4, bh - 24); }
}

function chips(t) {
  ctx.font = '700 18px FR';
  const gap = 14, padX = 16;
  const ws = CHIPS.map(c => ctx.measureText(c).width + padX * 2);
  const total = ws.reduce((a, b) => a + b, 0) + gap * (CHIPS.length - 1);
  let x = 640 - total / 2;
  CHIPS.forEach((c, i) => {
    const dy = -4 * Math.max(0, wave(t, 1, -i * 0.12));
    pill(c, x + ws[i] / 2, 300 + dy, '700 18px FR', padX, 34, i % 2 ? C.white : C.yellow, C.ink);
    x += ws[i] + gap;
  });
}

function render(t) {
  ctx.clearRect(0, 0, W, H);
  sky(t);
  clouds(t);
  hills();
  pill(KICKER, 640, 26, '24px LG', 22, 40, C.yellow, C.ink);
  title(t);
  phrase(t);
  chips(t);
  // marco
  ctx.lineWidth = 8; ctx.strokeStyle = C.ink; roundRect(4, 4, W - 8, H - 8, 26); ctx.stroke();
}

async function loadFonts() {
  const faces = [
    new FontFace('LG', 'url(../build/fonts/luckiest-guy-latin-400-normal.woff2)'),
    new FontFace('FR', 'url(../build/fonts/fredoka-latin-500-normal.woff2)', { weight: '500' }),
    new FontFace('FR', 'url(../build/fonts/fredoka-latin-700-normal.woff2)', { weight: '700' }),
  ];
  for (const f of faces) document.fonts.add(await f.load());
}

window.PERIOD = T;
window.render = render;
window.ready = loadFonts().then(() => {
  if (!location.search.includes('static')) {
    const t0 = performance.now();
    const loop = now => { render(((now - t0) / 1000) % T); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } else render(0);
});
</script>
</body>
</html>
